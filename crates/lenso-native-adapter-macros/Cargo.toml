[package]
name = "lenso-native-adapter-macros"
version = "0.1.2"
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
description = "Rust authoring macros for Lenso native Plugins and built-in Modules."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
proc-macro-crate = "3"
quote = "1"
serde_json = "1"
syn = { version = "2", features = ["full"] }
toml = "0.9"

[lints]
workspace = true
