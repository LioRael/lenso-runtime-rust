[package]
name = "lenso-dylib-adapter"
version = "0.2.8"
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
description = "Trusted versioned C-ABI dynamic-library Execution Adapter for Lenso."

[dependencies]
futures.workspace = true
lenso-app-plan.workspace = true
lenso-kernel.workspace = true
lenso-runtime-codec = { version = "0.4.1", path = "../lenso-runtime-codec" }
libloading = "0.9"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
hex.workspace = true
sha2.workspace = true
tempfile = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
