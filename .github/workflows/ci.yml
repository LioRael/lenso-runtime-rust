name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject machine-local paths in evidence
        run: |
          if git grep -n -E '/(Users|home)/[^/]+' -- docs/evidence; then
            echo '::error::Evidence must use portable commands, not machine-local home paths.'
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - name: Check browser Driver
        run: cargo check --locked -p lenso-browser-driver --all-targets --target wasm32-unknown-unknown
      - name: Check WASIp2 Driver
        run: cargo check --locked -p lenso-wasip2-driver --all-targets --target wasm32-wasip2
