name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject machine-local paths in evidence
        run: |
          if git grep -n -E '/(Users|home)/[^/]+' -- docs/evidence; then
            echo '::error::Evidence must use portable commands, not machine-local home paths.'
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Check browser Driver
        run: cargo check --locked -p lenso-browser-driver --all-targets --target wasm32-unknown-unknown
      - name: Check WASIp2 Driver
        run: cargo check --locked -p lenso-wasip2-driver --all-targets --target wasm32-wasip2

  browser-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: |
          curl -fsSL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-pack-v0.15.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Install matching ChromeDriver
        run: |
          chrome_major=$(google-chrome --version | awk '{ split($3, parts, "."); print parts[1] }')
          driver_url=$(curl -fsSL https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json \
            | jq -r --arg prefix "$chrome_major." '[.versions[] | select(.version | startswith($prefix))][-1].downloads.chromedriver[] | select(.platform == "linux64") | .url')
          test -n "$driver_url"
          curl -fsSL "$driver_url" -o "$RUNNER_TEMP/chromedriver.zip"
          unzip -q "$RUNNER_TEMP/chromedriver.zip" -d "$RUNNER_TEMP"
          echo "CHROMEDRIVER=$RUNNER_TEMP/chromedriver-linux64/chromedriver" >> "$GITHUB_ENV"
      - name: Run Browser Driver in headless Chrome
        run: wasm-pack test --headless --chrome --chromedriver "$CHROMEDRIVER" crates/lenso-browser-driver --locked

  wasip2-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Install Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613
        with:
          version: 48.0.0
      - name: Run WASIp2 Driver in Wasmtime
        env:
          CARGO_TARGET_WASM32_WASIP2_RUNNER: wasmtime
        run: cargo test --locked -p lenso-wasip2-driver --target wasm32-wasip2 --test smoke
