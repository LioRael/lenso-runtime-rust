[workspace]
# A merged release PR is the only publication boundary. Packages must also opt
# in through `publish = true` in their manifest.
# Release PR branches therefore keep release-plz's default `release-plz-`
# prefix so the release job can recognize their merged commits.
# crates.io Trusted Publishing cannot create a package. Bootstrap a new crate
# only after its release source passes `cargo publish --dry-run`; all later
# versions remain on this Release PR and Trusted Publishing boundary.
release_always = false
changelog_update = false
git_tag_name = "{{ package }}-v{{ version }}"
pr_labels = ["release"]
# Keep this recovery release scoped to the portable SDK chain. The accumulated
# Adapter and control-plane releases remain in PR #74 and are not authorized by
# this delivery. Revert this temporary allowlist after SDK publication.
release = false

[[package]]
name = "lenso-plugin-sdk-macros"
release = true

[[package]]
name = "lenso-plugin-sdk"
release = true
