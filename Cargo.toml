[workspace]
resolver = "2"
members = [
    "crates/lenso",
    "crates/lenso-browser-driver",
    "crates/lenso-dylib-adapter",
    "crates/lenso-guest-sdk",
    "crates/lenso-native-adapter",
    "crates/lenso-native-adapter-macros",
    "crates/lenso-plugin-bundle",
    "crates/lenso-plugin-control-plane",
    "crates/lenso-process-adapter",
    "crates/lenso-process-sdk",
    "crates/lenso-quickjs-adapter",
    "crates/lenso-runner",
    "crates/lenso-runtime-codec",
    "crates/lenso-test",
    "crates/lenso-wasm-component-adapter",
    "crates/lenso-wasip2-driver",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/LioRael/lenso-runtime-rust"
rust-version = "1.94"

[workspace.dependencies]
futures = "0.3"
hex = "0.4"
inventory = "0.3"
lenso-app-plan = { version = "0.3.0", git = "https://github.com/LioRael/lenso", rev = "cd35675a191d815b690c8889756dfe859a0e4d7b" }
lenso-kernel = { version = "0.2.0", git = "https://github.com/LioRael/lenso", rev = "cd35675a191d815b690c8889756dfe859a0e4d7b" }
lenso-runtime-conformance = { version = "0.2.0", git = "https://github.com/LioRael/lenso", rev = "cd35675a191d815b690c8889756dfe859a0e4d7b" }
lenso-plugin-authoring = { version = "0.1.1", git = "https://github.com/LioRael/lenso-protocols", rev = "9769bc5dc828fd9111da6d28a4ecd5f1bb198ab4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.52", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
