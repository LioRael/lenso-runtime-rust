[workspace]
resolver = "2"
members = [
    "crates/lenso",
    "crates/lenso-browser-driver",
    "crates/lenso-dylib-adapter",
    "crates/lenso-native-adapter",
    "crates/lenso-native-adapter-macros",
    "crates/lenso-plugin-control-plane",
    "crates/lenso-quickjs-adapter",
    "crates/lenso-runner",
    "crates/lenso-runtime-codec",
    "crates/lenso-wasm-component-adapter",
    "crates/lenso-wasip2-driver",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/LioRael/lenso-runtime-rust"
rust-version = "1.94"

[workspace.dependencies]
futures = "0.3"
hex = "0.4"
inventory = "0.3"
lenso-app-plan = "0.1.1"
lenso-kernel = "0.1.5"
lenso-module-authoring = { git = "https://github.com/LioRael/lenso-protocols", rev = "9a594895137b45a429876b34d8b7cfff008aa335" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.52", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
