[workspace]
resolver = "2"
members = [
    "crates/lenso",
    "crates/lenso-browser-driver",
    "crates/lenso-dylib-adapter",
    "crates/lenso-guest-sdk",
    "crates/lenso-native-adapter",
    "crates/lenso-native-adapter-macros",
    "crates/lenso-plugin-bundle",
    "crates/lenso-plugin-control-plane",
    "crates/lenso-plugin-sdk",
    "crates/lenso-plugin-sdk-macros",
    "crates/lenso-process-adapter",
    "crates/lenso-process-sdk",
    "crates/lenso-quickjs-adapter",
    "crates/lenso-remote-adapter",
    "crates/lenso-runner",
    "crates/lenso-runtime-codec",
    "crates/lenso-test",
    "crates/lenso-wasm-component-adapter",
    "crates/lenso-wasip2-driver",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/LioRael/lenso-runtime-rust"
rust-version = "1.94"

[workspace.dependencies]
futures = "0.3"
hex = "0.4"
inventory = "0.3"
lenso-app-plan = { version = "0.3.0", git = "https://github.com/LioRael/lenso", rev = "8599db7e4a214ed92f32089f81d14c833d4becf6" }
lenso-kernel = { version = "0.2.0", git = "https://github.com/LioRael/lenso", rev = "8599db7e4a214ed92f32089f81d14c833d4becf6" }
lenso-runtime-conformance = { version = "0.2.0", git = "https://github.com/LioRael/lenso", rev = "8599db7e4a214ed92f32089f81d14c833d4becf6" }
lenso-plugin-authoring = { version = "0.1.1", git = "https://github.com/LioRael/lenso-protocols", rev = "9d2774c767fd64a6cc63a5ac04360e9cb92816da" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
schemars = "1"
tokio = { version = "1.52", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
