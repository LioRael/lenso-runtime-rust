[workspace]
resolver = "2"
members = ["host", "echo", "caller"]

[workspace.dependencies]
lenso = { path = "../../crates/lenso" }
lenso-native-adapter = { path = "../../crates/lenso-native-adapter" }
lenso-kernel = "=0.3.6"
lenso-app-plan = "=0.4.1"
lenso-capability-http-endpoint = "=0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
