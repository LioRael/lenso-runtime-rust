[workspace]
resolver = "2"
members = ["host"]

[workspace.dependencies]
lenso-kernel = "=0.3.6"
lenso-native-adapter = { path = "../../crates/lenso-native-adapter" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"

# Local review cohort; published versions replace these paths after delivery.
[patch.crates-io]
lenso = { path = "../../crates/lenso" }
lenso-native-adapter = { path = "../../crates/lenso-native-adapter" }
