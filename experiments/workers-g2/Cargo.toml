[workspace]
resolver = "2"
members = ["host", "fixtures/duplex-endpoint-plugin", "fixtures/http-parity-plugin"]

[workspace.dependencies]
lenso-app-plan = "=0.4.1"
lenso-kernel = "=0.3.6"
lenso-native-adapter = { path = "../../crates/lenso-native-adapter" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"

# Runtime implementations come from this checkout; portable core and Web
# Capability contracts use the released cohort pinned in Cargo.lock.
[patch.crates-io]
lenso = { path = "../../crates/lenso" }
lenso-native-adapter = { path = "../../crates/lenso-native-adapter" }
